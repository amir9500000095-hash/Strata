name: Build

on:
  push:
    branches: [main, accessibility-improvements]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - name: Set the default git branch
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Fetch PDFium
        run: native/fetch-pdfium.sh

      - name: Build the native core
        run: native/build.sh

      - name: Build the debug APK
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: strata-a11y-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Signing key (optional)
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.STRATA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STRATA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STRATA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STRATA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore secrets — skipping signed release build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Build the signed release APKs
        if: github.event_name != 'pull_request' && steps.signing.outputs.has_keystore == 'true'
        run: |
          version=$(grep '^strata.versionName=' gradle.properties | cut -d= -f2)
          ./gradlew --stacktrace :app:assembleRelease -Pstrata.splitApks=true
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            src="app/build/outputs/apk/release/app-${abi}-release.apk"
            if [ -f "$src" ]; then
              cp "$src" "dist/StrataA11y-v${version}-${abi}.apk"
            fi
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload the signed release APKs
        if: github.event_name != 'pull_request' && steps.signing.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: strata-a11y-release
          path: |
            dist/
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Remove the signing key
        if: always()
        run: rm -f release.jks keystore.properties
